[package]
name = "rsolid-manifold"
version = "0.1.0"
description = "Manifold integration for rsolid - in-process CSG rendering"
edition = "2021"
license = "MIT"

exclude = [
    "glm/doc/**/*",
    "glm/test/**/*",
    "manifold/docs/**/*",
    "manifold/test/**/*",
    "manifold/samples/**/*",
]

[lib]
name = "rsolid_manifold"
path = "src/lib.rs"

[dependencies]
rsolid = { path = "../rsolid" }
cxx = "1.0"
cgmath = { version = "0.18.0", optional = true }

[build-dependencies]
cxx-build = "1.0"
cmake = "0.1"

[features]
default = []
output = ["cgmath"]
bevy_example = [
    "bevy",
    "bevy_panorbit_camera",
] # feature to bundle Bevy for the example

[dependencies.bevy]
version = "0.16"
optional = true

[dependencies.bevy_panorbit_camera]
version = "0.26.0"
optional = true

[[example]]
name = "simple"
path = "examples/simple.rs"

[[example]]
name = "bevy"
path = "examples/bevy.rs"
required-features = ["bevy_example"]

[[example]]
name = "write_ply"
path = "examples/write_ply.rs"
required-features = ["output"]

[[example]]
name = "write_stl"
path = "examples/write_stl.rs"
required-features = ["output"]
